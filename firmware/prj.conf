# Milestone 4a: SPI to the AX58100 + console over native USB.

CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Console runs on the ESP32-S3's built-in USB-Serial-JTAG (see
# app.overlay). No USB device stack is needed — the peripheral presents
# itself as a UART to Zephyr.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
