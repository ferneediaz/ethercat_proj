# Milestone 4a: SPI to the AX58100 + console over native USB.

CONFIG_SPI=y
CONFIG_GPIO=y

# Actuator PWM. Harmless when no actuator overlay is applied — the servo
# code compiles out entirely if the devicetree has no servo node.
CONFIG_PWM=y

# Stepper motion control. The gpio-step-dir controller driver enables itself
# from the devicetree, so this symbol alone is enough — and it costs nothing
# in the builds where no stepper overlay is applied.
CONFIG_STEPPER=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Console runs on the ESP32-S3's built-in USB-Serial-JTAG (see
# app.overlay). No USB device stack is needed — the peripheral presents
# itself as a UART to Zephyr.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
